version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(Actions)"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # Astro check currently requires TypeScript 6.x. Dependabot continues
      # updating compatible 6.x releases; remove this rule when Astro adds
      # TypeScript 7 support so major upgrades can resume automatically.
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
